[tool.ruff]
target-version = "py312"
line-length = 79
include = ["scripts/cloud/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["scripts/cloud"]
