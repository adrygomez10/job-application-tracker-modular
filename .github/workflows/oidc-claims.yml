name: Inspect AWS OIDC subject
on:
  workflow_dispatch:
permissions: {}
jobs:
  claims:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: aws-workshop
    permissions:
      id-token: write
    steps:
      - name: Show only non-sensitive identity claims
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=sts.amazonaws.com';
          const response = await fetch(url, {
            headers: {Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}
          });
          if (!response.ok) throw new Error('OIDC request failed');
          const {value} = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
          console.log(JSON.stringify({
            iss: claims.iss, aud: claims.aud, sub: claims.sub,
            repository_id: claims.repository_id, repository_owner_id: claims.repository_owner_id
          }, null, 2));
          NODE
