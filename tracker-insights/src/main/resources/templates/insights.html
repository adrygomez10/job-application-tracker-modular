<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Estadísticas', ~{::main}, 'insights')}"><main id="main" class="container"><h1>Estadísticas</h1><p>Se excluyen las candidaturas archivadas. La tasa cuenta las candidaturas enviadas con al menos una entrevista no cancelada, sobre todas las candidaturas con fecha de solicitud.</p><section class="panel"><h2>Tasa de entrevistas</h2><p><strong th:text="${rate}"></strong></p><p><span th:text="${statistics.interviewed}"></span> candidaturas con entrevista de <span th:text="${statistics.submitted}"></span> enviadas.</p></section><section class="panel"><h2>Candidaturas por estado</h2><ul><li th:each="count : ${statistics.byStatus}"><span th:text="${count.key}"></span>: <strong th:text="${count.value}"></strong></li></ul></section></main></html>
