<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Recordatorios', ~{::main}, 'reminders')}"><main id="main" class="container"><h1>Recordatorios</h1><p>Tareas vencidas y entrevistas en las próximas 24 horas. Se revisan al arrancar y cada minuto mientras la aplicación esté encendida.</p><p>Última actualización: <span th:text="${snapshot.checkedAt != null ? snapshot.checkedAt : 'Sin actualizar'}"></span></p><p role="alert" th:if="${failed}">La última revisión falló. Estos datos corresponden a la actualización anterior.</p><p th:if="${snapshot.active.isEmpty()}">No hay avisos pendientes.</p><ul class="panel" th:unless="${snapshot.active.isEmpty()}"><li th:each="notice : ${snapshot.active}"><a th:href="@{/applications/{id}(id=${notice.applicationId})}" th:text="${notice.title}"></a> · <span th:text="${notice.kind}"></span> · <time th:text="${notice.dueAt}"></time></li></ul></main></html>
